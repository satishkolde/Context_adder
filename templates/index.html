<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Context Labeling</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }

      h1 {
        color: #ffffff;
        margin-bottom: 1.5rem;
      }

      #text-display {
        font-size: 1.2rem;
        background-color: #1e1e1e;
        padding: 1rem;
        border-radius: 8px;
        width: 90%;
        max-width: 600px;
        text-align: center;
        margin-bottom: 1rem;
        border: 1px solid #333;
      }

      #controls {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      select {
        padding: 0.5rem;
        background-color: #2c2c2c;
        color: #ffffff;
        border: 1px solid #444;
        border-radius: 8px;
      }

      button {
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 50%;
        padding: 0.7rem 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #0056b3;
      }

      button:disabled {
        background-color: #444;
        cursor: not-allowed;
      }

      .hidden {
        display: none;
      }

      #message {
        margin-top: 1rem;
        font-size: 1rem;
        color: #00e676;
      }
    </style>
  </head>
  <body>
    <h1>Parental Control Context Labeling</h1>
    <div id="text-display">Loading...</div>
    <div id="controls">
      <select id="context">
        <option value="" disabled selected>Select context</option>
        <option value="Educational">Educational</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Social">Social</option>
        <option value="Violent">Violent</option>
        <option value="Sexual">Sexual</option>
        <option value="Emotional">Emotional</option>
        <option value="Neutral">Neutral</option>
        <option value="Search/Query">Search/Query</option>
        <option value="Distraction">Distraction</option>
        <option value="Suspicious">Suspicious</option>
      </select>
      <button id="submit">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
    <div id="message"></div>

    <script>
      const textDisplay = document.getElementById("text-display");
      const contextSelect = document.getElementById("context");
      const submitBtn = document.getElementById("submit");
      const messageDiv = document.getElementById("message");
      let currentIndex = -1;

      async function fetchNext() {
        const res = await fetch("/get_row");
        const data = await res.json();
        if (data.done) {
          textDisplay.textContent = "🎉 All done! Great job!";
          messageDiv.textContent = "All entries have been labeled.";
          contextSelect.disabled = true;
          submitBtn.disabled = true;
        } else {
          textDisplay.textContent = data.text;
          currentIndex = data.index;
          contextSelect.value = "";
        }
      }

      submitBtn.addEventListener("click", async () => {
        const selected = contextSelect.value;
        if (!selected) return alert("Please select a context.");

        await fetch("/submit_label", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: currentIndex, context: selected }),
        });
        fetchNext();
      });

      fetchNext();
    </script>
  </body>
</html>
