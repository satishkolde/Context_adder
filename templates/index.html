<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text Labeling - Parental Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f2f2f2;
    }

    .container {
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .text-display {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      background: #fafafa;
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    select, button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 1.5rem;
    }

    button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 480px) {
      .container {
        padding: 1rem;
      }

      h2 {
        font-size: 1.25rem;
      }

      .text-display {
        font-size: 1rem;
      }

      select, button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Parental Control Text Labeling</h2>
    <div class="text-display" id="text">Loading...</div>

    <label for="context">Context</label>
    <select id="context">
      <option value="education">Education - School, study, homework</option>
      <option value="entertainment">Entertainment - Games, fun, videos</option>
      <option value="social">Social - Chats, social media</option>
      <option value="searching">Searching - Curiosity, general queries</option>
      <option value="inappropriate">Inappropriate - Unsafe/adult topics</option>
      <option value="violence">Violence - Threats, fighting</option>
      <option value="self_harm">Self Harm - Depression, mental distress</option>
      <option value="shopping">Shopping - Buying, money talk</option>
      <option value="health">Health - Sickness, well-being</option>
      <option value="relationship">Relationship - Love, crushes</option>
      <option value="religion">Religion - Beliefs, prayers</option>
      <option value="politics">Politics - Leaders, elections</option>
      <option value="other">Other - Doesn’t fit any category</option>
    </select>

    <label for="sentiment">Sentiment</label>
    <select id="sentiment">
      <option value="positive">Positive</option>
      <option value="neutral">Neutral</option>
      <option value="negative">Negative</option>
    </select>

    <label for="risk">Risk Level</label>
    <select id="risk">
      <option value="low">Low</option>
      <option value="moderate">Moderate</option>
      <option value="high">High</option>
    </select>

    <button onclick="submitLabel()">Submit</button>
  </div>

  <script>
    let currentIndex = -1;
    async function loadText() {
      const res = await fetch('/get_row');
      const data = await res.json();
      document.getElementById('text').textContent = data.text;
      currentIndex = data.index;
    }

    async function submitLabel() {
      const context = document.getElementById('context').value;
      const sentiment = document.getElementById('sentiment').value;
      const risk = document.getElementById('risk').value;

      await fetch('/submit_label', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ "index":currentIndex,context, sentiment, risk }),
      });

      loadText();
    }

    loadText();
  </script>
</body>
</html>
